<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ramayana: Path of the Bow</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-50 -50 100 100'%3E%3Ccircle r='48' fill='%230b1030'/%3E%3Ccircle r='34' fill='none' stroke='%23e8b44c' stroke-width='6'/%3E%3Ccircle r='9' fill='%23e8b44c'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --gold: #e8b44c;
        --saffron: #f08a24;
        --teal: #1f8a8a;
        --indigo: #0b1030;
        --ink: #05060f;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--ink);
        font-family: 'Cormorant Garamond', 'Palatino Linotype', Palatino, Georgia, serif;
        color: #f4e6c8;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #loading {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background:
          radial-gradient(ellipse 90% 60% at 50% 108%, rgba(240, 138, 36, 0.55), transparent 60%),
          radial-gradient(ellipse 70% 50% at 50% 100%, rgba(232, 180, 76, 0.35), transparent 70%),
          linear-gradient(#060817 0%, #0b1030 45%, #123a4a 78%, #3b2a1a 100%);
        transition:
          opacity 1.5s ease,
          background-color 1.5s ease;
      }
      #loading.ready {
        background: radial-gradient(ellipse at 50% 55%, rgba(5, 6, 15, 0.15), rgba(5, 6, 15, 0.72));
      }
      #loading.done {
        opacity: 0;
        pointer-events: none;
      }
      #loading .mark {
        width: 74px;
        height: 74px;
        animation: spin 22s linear infinite;
        filter: drop-shadow(0 0 14px rgba(232, 180, 76, 0.6));
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #loading h1 {
        margin: 0;
        font-size: clamp(34px, 6.4vw, 84px);
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        text-align: center;
        background: linear-gradient(#fff3cf 10%, var(--gold) 55%, #a8641a 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 0 40px rgba(240, 138, 36, 0.25);
      }
      #loading h2 {
        margin: -10px 0 0;
        font-size: clamp(13px, 1.6vw, 20px);
        font-weight: 400;
        letter-spacing: 0.62em;
        text-transform: uppercase;
        color: #9fd6d2;
        padding-left: 0.62em;
      }
      #loading .track {
        width: min(360px, 60vw);
        height: 2px;
        background: rgba(244, 230, 200, 0.16);
        overflow: hidden;
        margin-top: 18px;
      }
      #loading-bar {
        height: 100%;
        background: linear-gradient(90deg, var(--saffron), var(--gold), #fff3cf);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.35s ease;
      }
      #loading-label {
        min-height: 1.3em;
        font-size: 15px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(244, 230, 200, 0.62);
      }
      #loading-begin {
        display: none;
        font: inherit;
        font-size: 17px;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        color: #fff3cf;
        background: rgba(11, 16, 48, 0.35);
        border: 1px solid rgba(232, 180, 76, 0.7);
        padding: 14px 34px 14px 40px;
        cursor: pointer;
        backdrop-filter: blur(4px);
        transition:
          background 0.3s,
          box-shadow 0.3s;
      }
      #loading-begin:hover,
      #loading-begin:focus-visible {
        background: rgba(232, 180, 76, 0.22);
        box-shadow: 0 0 28px rgba(232, 180, 76, 0.45);
        outline: none;
      }
      #loading.ready .track,
      #loading.ready #loading-label {
        display: none;
      }
      #loading.ready #loading-begin {
        display: block;
        margin-top: 18px;
      }
      #fps-meter {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 5;
        font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace;
        white-space: pre;
        color: #d8f3e4;
        background: rgba(5, 6, 15, 0.55);
        padding: 6px 9px;
        border-left: 2px solid var(--gold);
        pointer-events: none;
      }
      #hint {
        position: fixed;
        bottom: 14px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 5;
        font-size: 13px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(244, 230, 200, 0.55);
        text-shadow: 0 1px 6px #000;
        pointer-events: none;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="loading">
      <svg class="mark" viewBox="-50 -50 100 100" aria-hidden="true">
        <g fill="none" stroke="#e8b44c" stroke-width="1.6">
          <circle r="46" />
          <circle r="30" />
          <circle r="7" fill="#e8b44c" />
          <g id="spokes">
            <path d="M0-30V-46M0 30V46M-30 0H-46M30 0H46" />
            <path d="M21.2-21.2 32.5-32.5M-21.2-21.2-32.5-32.5M21.2 21.2 32.5 32.5M-21.2 21.2-32.5 32.5" />
            <path
              d="M0-30C6-20 6-12 0-7C-6-12-6-20 0-30ZM0 30C6 20 6 12 0 7C-6 12-6 20 0 30ZM-30 0C-20-6-12-6-7 0C-12 6-20 6-30 0ZM30 0C20-6 12-6 7 0C12 6 20 6 30 0Z"
            />
          </g>
        </g>
      </svg>
      <h1>Ramayana</h1>
      <h2>Path of the Bow</h2>
      <div class="track"><div id="loading-bar"></div></div>
      <div id="loading-label">Awakening</div>
      <button id="loading-begin" type="button">Begin</button>
    </div>
    <div id="hint"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
